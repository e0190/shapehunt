<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shape Hunt</title>
<style>
:root{
  --bg:#ffffff; --card:#ffffff; --ink:#222; --muted:#666; --line:#bdbdbd;
  --accent:#2f6fc0; --accent-ink:#fff; --good:#2e7d32; --bad:#c62828; --stroke:#1e3a5f;
  --bar:#2f74c8; --pick:#8a1c5f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,Segoe UI,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;background:var(--bar);color:#fff}
h1{font-size:21px;margin:0;font-weight:400}
.code{font-size:14px;color:#dbe7f7} .code b{color:#fff;font-size:18px;letter-spacing:2px}
.solid{width:100%;height:100%;display:block;padding:4%}
.solid polygon{stroke:#1f5a9e;stroke-width:4;stroke-linejoin:round}
.solid .back{stroke:#1f5a9e;stroke-width:.8;stroke-dasharray:2.2 1.8;opacity:.75}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;max-width:1080px;margin:0 auto;padding:16px}
@media (max-width:800px){main{grid-template-columns:1fr}}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{position:relative;aspect-ratio:1;background:#fff;border:2px solid var(--line);transition:opacity .2s}
.board{max-width:560px}
.board.click .card{cursor:pointer}
.board.click .card:hover{border-color:#888}
.card.out{opacity:.25}
.card.secret{border:4px solid var(--pick)}
.board.guessing .card:not(.out){border-color:var(--pick);border-style:dashed}
.panel{background:#fff;border:1px solid var(--line);border-radius:2px;padding:16px;display:flex;flex-direction:column;gap:12px;align-self:start}
.label{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.role{font-size:18px;font-weight:600}
input,button{font:inherit;border-radius:8px;border:1px solid var(--line);padding:10px 12px;background:var(--bg);color:var(--ink)}
input{width:100%}
button{cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.msg{font-size:15px}
.big{font-size:18px;font-weight:600}
.log{font-size:14px;max-height:260px;overflow:auto;border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.log .n{color:var(--muted);font-size:12px}
.yes{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}
.lobby{max-width:420px;margin:40px auto;padding:0 16px;display:flex;flex-direction:column;gap:14px}
.lobby .panel{gap:10px}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
.overlay{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.modal{background:var(--card);border-radius:14px;padding:24px;max-width:420px;width:100%;text-align:center}
.modal .card{width:140px;margin:12px auto}
.modal h2{margin:0 0 6px}
.hidden{display:none!important}
</style>
</head>
<body>
<header><h1>Shape Hunt</h1><div class="code" id="codeBox"></div></header>

<div class="lobby" id="lobby">
  <p class="msg">One player secretly picks a shape. The other types yes/no questions and crosses shapes out until they can guess it.</p>
  <div class="panel">
    <div class="label">Start a game</div>
    <button class="primary" data-create="1">Create a room</button>
    <div class="msg" style="font-size:14px;color:var(--muted)">Who picks and who guesses is random each round.</div>
  </div>
  <div class="panel">
    <div class="label">Join a friend</div>
    <div class="row"><input id="joinCode" maxlength="4" placeholder="Room code" autocomplete="off" style="text-transform:uppercase"><button id="joinBtn">Join</button></div>
  </div>
  <div class="err" id="lobbyErr"></div>
</div>

<main id="game" class="hidden">
  <section><div class="board" id="board"></div></section>
  <aside class="panel">
    <div><div class="label">You are the</div><div class="role" id="role"></div></div>
    <div id="controls"></div>
    <div class="err" id="err"></div>
    <div class="label">Questions asked: <b id="qCount">0</b></div>
    <div class="log" id="log"></div>
  </aside>
</main>
<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// The rooms live on shapehunt.pages.dev; copies elsewhere (GitHub, .ek) call it there.
function star(){let p=[];for(let i=0;i<10;i++){const r=i%2?17:42,a=(-90+36*i)*Math.PI/180;p.push((50+r*Math.cos(a)).toFixed(1)+','+(54+r*Math.sin(a)).toFixed(1))}return `<polygon points="${p.join(' ')}"/>`}
const P=s=>`<polygon points="${s}"/>`;
const SHAPES=[
 P("50,12 90,82 10,82"), P("20,15 20,85 85,85"), P("18,18 82,18 82,82 18,82"), P("8,30 92,30 92,70 8,70"),
 P("50,6 78,50 50,94 22,50"), P("30,25 70,25 92,75 8,75"), P("50,12 88,39.6 73.5,84.4 26.5,84.4 12,39.6"),
 P("30,15.4 70,15.4 90,50 70,84.6 30,84.6 10,50"), P("15,10 40,10 40,60 88,60 88,85 15,85"), star(),
 `<circle cx="50" cy="50" r="40"/>`, `<path d="M10,68 A40,40 0 0 1 90,68 Z"/>`,
 `<path d="M60,10 A40,40 0 1 0 60,90 A50,50 0 0 1 60,10 Z"/>`, P("15,20 85,80 85,20 15,80"),
 `<polyline points="8,70 29,30 50,70 71,30 92,70"/>`, `<path d="M8,50 C22,8 40,8 50,50 S78,92 92,50"/>`,
];
// ---- your 16 cards, traced from the original screenshot (456x456 grid) ----
// tones: L light top, R light side, M mid, D dark
const TONE={L:'#e0ebf9',R:'#c9def6',M:'#a7c9ee',D:'#64a3e3'};
const TRACED=[
 [['D','78,125 192,214 195,355 78,248'],['M','192,214 388,137 384,265 195,355'],['L','78,125 388,137 192,214']],
 [['D','75,320 185,268 402,310'],['M','220,138 75,320 185,268'],['R','220,138 185,268 402,310']],
 [['D','140,72 190,100 190,420 142,382'],['M','190,100 305,97 305,415 190,420'],['R','305,97 322,66 320,375 305,415'],['L','140,72 228,52 322,66 305,97 190,100']],
 [['D','138,48 240,75 240,422 142,393'],['M','240,75 325,45 322,385 240,422'],['L','138,48 225,28 325,45 240,75']],
 [['D','78,158 110,215 115,338 80,275'],['M','110,215 315,217 310,345 115,338'],['R','315,217 380,165 377,282 310,345'],['L','78,158 237,132 380,165 315,217 110,215']],
 [['D','82,127 120,203 125,345 85,255'],['M','120,203 397,188 393,325 125,345'],['L','82,127 330,113 397,188 120,203']],
 [['D','155,63 290,97 290,410 160,362'],['M','290,97 325,48 325,345 290,410'],['L','155,63 325,48 290,97']],
 [['D','155,408 190,372 320,397'],['M','220,52 155,408 190,372'],['R','220,52 190,372 320,397']],
 [['D','45,342 120,302 415,317 318,352'],['M','225,163 45,342 120,302'],['R','225,163 120,302 415,317']],
 [['D','138,405 178,378 312,385 275,412'],['M','225,80 138,405 178,378'],['R','225,80 178,378 312,385']],
 [['D','48,272 275,250 420,297 285,335 72,323'],['M','222,140 48,272 275,250'],['R','222,140 275,250 420,297']],
 [['D','125,390 160,362 305,362 345,388 240,405'],['M','232,62 125,390 160,362'],['R','232,62 160,362 305,362'],['L','232,62 305,362 345,388']],
 [['D','122,153 155,205 120,333 75,238'],['M','155,205 352,197 403,310 120,333'],['L','122,153 305,138 352,197 155,205']],
 [['D','165,58 262,75 278,428 118,402'],['M','262,75 300,47 345,365 278,428'],['L','165,58 208,40 300,47 262,75']],
 [['D','108,157 290,305 228,432 55,290'],['M','290,305 422,180 355,305 228,432'],['L','108,157 245,42 422,180 290,305']],
 [['M','230,68 62,215 187,282'],['R','230,68 187,282 397,245'],['D','62,215 187,282 230,395'],['M','187,282 397,245 230,395']],
];
const ART=TRACED.map(fs=>`<svg viewBox="20 20 416 416" class="solid">${fs.map(([t,p])=>`<polygon points="${p}" fill="${TONE[t]}"/>`).join('')}</svg>`);
const cardHTML=i=>ART[i];
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---- device-to-device play over PeerJS: the room creator's browser runs the rules ----
const PREFIX='shapehunt-k3-';
const CODE_CHARS='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
let peer=null, conn=null, isHost=false, code=null, S=null, room=null, localOut=new Set(), guessing=false, busy=false, lastPhase=null;
const me=()=>isHost?'host':'guest';

function shuffled(){const a=[...Array(16).keys()];for(let i=15;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function freshRound(st){Object.assign(st,{order:shuffled(),secret:null,phase:st.players.length===2?'pick':'waiting',q:[],out:[],result:null})}
function assignRandom(st){const [a,b]=Math.random()<.5?st.players:[...st.players].reverse();st.picker=a;st.guesser=b}
function view(st,who){
  const role=st.picker===who?'picker':st.guesser===who?'guesser':null;
  const v={...st,role};delete v.picker;delete v.guesser;delete v.players;
  if(role!=='picker'&&st.phase!=='over')v.secret=null;return v}
// host only: apply one action from a player, returns error text or null
function handle(st,who,b){
  const isP=st.picker===who,isG=st.guesser===who;
  switch(b.action){
    case 'pick': if(!isP||st.phase!=='pick'||!(b.card>=0&&b.card<16))return 'Not your move';
      st.secret=b.card;st.phase='ask';break;
    case 'ask':{const t=String(b.text||'').trim().slice(0,200);if(!isG||st.phase!=='ask'||!t)return 'Not your move';
      st.q.push({t,a:null});st.phase='answer';break}
    case 'answer': if(!isP||st.phase!=='answer')return 'Not your move';
      st.q[st.q.length-1].a=b.answer?'yes':'no';st.phase='elim';break;
    case 'elim': if(!isG||st.phase!=='elim')return 'Not your move';
      st.out=[...new Set((b.out||[]).filter(n=>n>=0&&n<16))];
      if(st.out.includes(st.secret)){st.phase='over';st.result={win:false,reason:'eliminated'}}else st.phase='ask';break;
    case 'guess': if(!isG||st.phase!=='ask')return 'Not your move';
      st.phase='over';st.result={win:b.card===st.secret,reason:b.card===st.secret?'guessed':'wrong',card:b.card};break;
    case 'again': if(st.phase!=='over')return null;assignRandom(st);freshRound(st);break;
    default: return 'unknown action'}
  return null}
function broadcast(){apply(view(room,'host'));if(conn&&conn.open)conn.send({t:'state',state:view(room,'guest')})}

function act(body){
  $('err').textContent='';
  if(isHost){const e=handle(room,'host',body);if(e)$('err').textContent=e;else broadcast()}
  else if(conn&&conn.open)conn.send({t:'act',body});
  else $('err').textContent='Lost connection to your friend.';
}
function enterGame(){
  history.replaceState(null,'','?room='+code);
  $('lobby').classList.add('hidden');$('game').classList.remove('hidden');
  $('codeBox').innerHTML=`Room <b>${code}</b>`;
}
function hostRoom(){
  code='';for(let i=0;i<4;i++)code+=CODE_CHARS[Math.random()*CODE_CHARS.length|0];
  isHost=true;room={players:['host'],picker:null,guesser:null};freshRound(room);
  peer=new Peer(PREFIX+code);
  peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();hostRoom()}else $('lobbyErr').textContent='Connection problem ('+e.type+'). Try again.'});
  peer.on('open',()=>{enterGame();broadcast()});
  peer.on('connection',c=>{
    if(conn&&conn.open){c.on('open',()=>{c.send({t:'full'});setTimeout(()=>c.close(),300)});return}
    conn=c;
    c.on('open',()=>{if(!room.players.includes('guest')){room.players.push('guest');assignRandom(room);freshRound(room)}broadcast()});
    c.on('data',d=>{if(d&&d.t==='act'){const e=handle(room,'guest',d.body);if(e)c.send({t:'err',msg:e});else broadcast()}});
    c.on('close',()=>{conn=null;$('err').textContent='Your friend disconnected. They can rejoin with the same code.'});
  });
}
function join(c){
  c=c.trim().toUpperCase();if(!c)return;code=c;isHost=false;$('lobbyErr').textContent='Connecting...';
  peer=new Peer();
  peer.on('error',e=>{$('lobbyErr').textContent=e.type==='peer-unavailable'?"That room isn't open. Check the code, or ask your friend to keep their page open.":'Connection problem: '+e.type;history.replaceState(null,'',location.pathname)});
  peer.on('open',()=>{
    conn=peer.connect(PREFIX+code,{reliable:true});
    conn.on('open',()=>{$('lobbyErr').textContent='';enterGame()});
    conn.on('data',d=>{if(d.t==='state')apply(d.state);else if(d.t==='err')$('err').textContent=d.msg;
      else if(d.t==='full')$('lobbyErr').textContent='That room already has two players.'});
    conn.on('close',()=>{$('err').textContent='Lost connection to your friend. Reload and rejoin with the code.'});
  });
}
document.querySelectorAll('[data-create]').forEach(b=>b.onclick=()=>{$('lobbyErr').textContent='Opening a room...';hostRoom()});
$('joinBtn').onclick=()=>join($('joinCode').value);
$('joinCode').onkeydown=e=>{if(e.key==='Enter')join($('joinCode').value)};
window.addEventListener('beforeunload',e=>{if(isHost&&conn&&conn.open){e.preventDefault();e.returnValue=''}});

function apply(s){
  const newRound=S&&s.phase!=='over'&&s.q.length===0&&S.q.length>0;
  if(!S||newRound||s.role!==S.role||(s.role==='picker')||s.phase==='over')localOut=new Set(s.out);
  if(s.phase==='over'||s.phase!=='ask')guessing=false;
  S=s; render();
  if(s.phase!==lastPhase&&s.phase!=='over'&&document.hidden)document.title='(!) Shape Hunt';
  lastPhase=s.phase;
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)document.title='Shape Hunt'});

function render(){
  const isP=S.role==='picker', isG=S.role==='guesser';
  $('role').textContent=S.phase==='waiting'?'(decided when your friend joins)':isP?'Picker':isG?'Guesser':'Spectator';
  $('qCount').textContent=S.q.length;
  // board
  const b=$('board'); b.innerHTML='';
  const canTap=(isP&&S.phase==='pick')||(isG&&['ask','answer','elim'].includes(S.phase));
  b.className='board'+(canTap?' click':'')+(guessing?' guessing':'');
  const out=isG?localOut:new Set(S.out);
  S.order.forEach(i=>{
    const c=document.createElement('div'); c.className='card'; c.innerHTML=cardHTML(i);
    if(out.has(i))c.classList.add('out');
    if(isP&&S.secret===i)c.classList.add('secret');
    c.onclick=()=>tap(i); b.appendChild(c);
  });
  // log
  $('log').innerHTML=S.q.slice().reverse().map((q,k)=>`<div><span class="n">Q${S.q.length-k}</span> ${esc(q.t)} ${q.a?`<span class="${q.a}">${q.a==='yes'?'Yes':'No'}</span>`:'<span class="n">waiting...</span>'}</div>`).join('');
  controls(isP,isG);
  // end screen
  if(S.phase==='over'&&S.result)showEnd(isG); else $('ov').classList.remove('show');
}

function controls(isP,isG){
  const c=$('controls'), ph=S.phase;
  const wait=t=>c.innerHTML=`<div class="msg">${t}</div>`;
  if(ph==='waiting'){wait(`Waiting for a friend. Send them the code <b>${code}</b> or this page's link.`);return}
  if(isP){
    if(ph==='pick'){wait('<span class="big">Tap the shape you want to hide.</span>');return}
    if(ph==='answer'){
      const q=S.q[S.q.length-1].t;
      c.innerHTML=`<div class="label">They ask</div><div class="big">${esc(q)}</div>
        <div class="row" style="margin-top:8px"><button class="primary" id="y">Yes</button><button class="primary" id="n">No</button></div>`;
      $('y').onclick=()=>act({action:'answer',answer:true}); $('n').onclick=()=>act({action:'answer',answer:false}); return}
    if(ph==='ask'){wait('The guesser is thinking of a question...');return}
    if(ph==='elim'){wait('The guesser is crossing out shapes...');return}
  }
  if(isG){
    if(ph==='pick'){wait('Your friend is picking a secret shape...');return}
    if(ph==='ask'){
      if(guessing){c.innerHTML=`<div class="big">Tap the shape you think it is.</div><button id="cancel" style="width:100%;margin-top:8px">Back</button>`;
        $('cancel').onclick=()=>{guessing=false;render()};return}
      c.innerHTML=`<div class="label">Ask a yes/no question</div>
        <form id="qf" class="row"><input id="qt" maxlength="200" placeholder="Does it have curved edges?" autocomplete="off"><button class="primary" style="flex:0 0 auto">Ask</button></form>
        <button id="guessBtn" style="width:100%;margin-top:8px">I know it, make a guess</button>`;
      $('qf').onsubmit=e=>{e.preventDefault();const t=$('qt').value.trim();if(t)act({action:'ask',text:t})};
      $('guessBtn').onclick=()=>{guessing=true;render()};
      setTimeout(()=>$('qt')&&$('qt').focus(),0);return}
    if(ph==='answer'){wait('Waiting for their answer...');return}
    if(ph==='elim'){
      const a=S.q[S.q.length-1].a;
      c.innerHTML=`<div class="msg">They said <span class="${a}">${a==='yes'?'Yes':'No'}</span>. Tap the shapes this rules out, then press Done.</div>
        <button class="primary" id="done" style="width:100%;margin-top:8px">Done</button>`;
      $('done').onclick=()=>act({action:'elim',out:[...localOut]});return}
  }
  c.innerHTML='';
}

function tap(i){
  if(!S||busy)return;
  if(S.role==='picker'&&S.phase==='pick'){act({action:'pick',card:i});return}
  if(S.role!=='guesser'||!['ask','answer','elim'].includes(S.phase))return;
  if(guessing){if(!localOut.has(i))act({action:'guess',card:i});return}
  localOut.has(i)?localOut.delete(i):localOut.add(i); render();
}

function showEnd(isG){
  const r=S.result, guesserWon=r.win;
  const iWon=isG?guesserWon:!guesserWon;
  const why=r.reason==='guessed'?`The secret shape was found in ${S.q.length} question${S.q.length===1?'':'s'}.`
    :r.reason==='wrong'?'Wrong guess.':'The secret shape got crossed out.';
  $('modal').innerHTML=`<h2 style="color:var(${iWon?'--good':'--bad'})">${iWon?'You win':'You lose'}</h2><div>${why}</div>
    <div class="label" style="margin-top:12px">The secret shape</div><div class="card">${cardHTML(S.secret)}</div>
    <button class="primary" id="again">Play again</button>`;
  $('again').onclick=()=>act({action:'again'});
  $('ov').classList.add('show');
}

const pre=new URLSearchParams(location.search).get('room'); if(pre)join(pre);
</script>
</body>
</html>
